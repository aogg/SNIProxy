# 监听端口（注意需要引号）
listen_addr: ":443"
# 可选：下面这个的作用是用来将传入的 HTTP 重定向为 HTTPS（固定的 443 端口和上面配置无关），如果没写将不监听及处理 HTTP 连接
#listen_addr_http: ":80"

# 可选：启用 Socks5 前置代理
#enable_socks5: true
# 可选：配置 Socks5 代理地址
#socks_addr: 127.0.0.1:40000
# 可选：配置 Socks5 代理的账号和密码（如果有的话）
#socks_username: admin
#socks_password: abc123

# 可选：环境变量 HTTP 代理（没有配置文件配置项，只能通过环境变量设置，不做 NO_PROXY 支持）
# 变量按优先级取第一个非空值：HTTPS_PROXY > https_proxy > HTTP_PROXY > http_proxy > ALL_PROXY > all_proxy
# 值仅支持 http:// 前缀或省略 scheme（省略视为 http://），支持 user:pass@host[:port]（CONNECT 时加认证头），端口缺省 80，例如：
#   HTTPS_PROXY=http://127.0.0.1:8080
#   HTTPS_PROXY=user:pass@1.2.3.4
# 行为：仅当第 1 轮（直连或 Socks5 前置）逐 IP 轮询全部失败后，才会用该 HTTP 代理对同一候选 IP 列表按同一顺序再轮询一轮（回退），
# 代理轮询的结果不会写入内部排序缓存；其他 scheme（如 socks5://）或解析失败会在启动日志 warn 一条后忽略（等同未设置）

# 可选：DNS 对同一域名返回多个 IP 时，连接失败会在内部自动重试下一个 IP（以下为默认值，单位：秒）
#dial_timeout: 5       # 连接单个后端 IP 的超时时间，超时后自动尝试下一个 IP
#first_byte_timeout: 5 # 连接后等待后端响应第一个字节的超时时间，超时说明该 IP 已假死，自动尝试下一个 IP
# 可选：连接前先用真实 TLS 握手（含完整证书校验）验证候选 IP 是否真的可用，避免连上“假死/坏边缘节点”后一直返回错误页面
#verify_tls: true      # 默认开启，设为 false 则完全退回原有行为（不做 TLS 验证）；验证成功的 IP 缓存 10 分钟、验证失败的 IP 60 秒内不再尝试；探测握手超时复用 first_byte_timeout

# 二选一：允许所有域名（开启后会忽略下面的 rules 列表，二选一）
#allow_all_hosts: true

# 二选一：仅允许指定域名（和上面的 allow_all_hosts 二选一）
rules:
  - example.com
  - b.example2.com