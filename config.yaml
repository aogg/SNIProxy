# 监听端口（注意需要引号）
listen_addr: ":443"
# 可选：下面这个的作用是用来将传入的 HTTP 重定向为 HTTPS（固定的 443 端口和上面配置无关），如果没写将不监听及处理 HTTP 连接
#listen_addr_http: ":80"

# 可选：启用 Socks5 前置代理
#enable_socks5: true
# 可选：配置 Socks5 代理地址
#socks_addr: 127.0.0.1:40000
# 可选：配置 Socks5 代理的账号和密码（如果有的话）
#socks_username: admin
#socks_password: abc123

# 可选：AGAIN_PROXY HTTP 回退代理（仅当第 1 轮直连轮询全部失败后，才用该代理对同一候选 IP 列表按同一顺序再轮询一轮）
# 来源优先级：环境变量 AGAIN_PROXY（先 AGAIN_PROXY 后 again_proxy，取第一个非空值）优先，未设置（或值非法被忽略）时再用下面的 again_proxy 配置项，两者都无效 = 未配置代理（回退轮询关闭）
# 值仅支持 http:// 前缀或省略 scheme（省略视为 http://），支持 user:pass@host[:port]（CONNECT 时加认证头），端口缺省 80，例如：
#   环境变量：AGAIN_PROXY=http://192.168.1.1:8899
#   配置文件：again_proxy: http://192.168.1.1:8899
# 其他 scheme（如 socks5://）或解析失败会在启动日志 warn 一条后忽略（等同未设置）；不支持 NO_PROXY，也不再支持 HTTPS_PROXY/HTTP_PROXY/ALL_PROXY 等其他代理环境变量
#again_proxy: http://192.168.1.1:8899

# 可选：DNS 对同一域名返回多个 IP 时，连接失败会在内部自动重试下一个 IP（以下为默认值，单位：秒）
#dial_timeout: 5       # 连接单个后端 IP 的超时时间，超时后自动尝试下一个 IP
#first_byte_timeout: 5 # 连接后等待后端响应第一个字节的超时时间，超时说明该 IP 已假死，自动尝试下一个 IP
# 可选：连接前先用真实 TLS 握手（含完整证书校验）验证候选 IP 是否真的可用，避免连上“假死/坏边缘节点”后一直返回错误页面
#verify_tls: true      # 默认开启，设为 false 则完全退回原有行为（不做 TLS 验证）；验证成功的 IP 缓存 10 分钟、验证失败的 IP 60 秒内不再尝试；探测握手超时复用 first_byte_timeout

# 可选：传输进度/停滞检测日志（双向转发期间的可观测性日志；↑=客户端→后端，↓=后端→客户端）
#progress_interval: 10 # 传输进度日志间隔秒：达到间隔且有新增字节时输出一条进度日志（↑↓累计量/窗口速率/已运行时长），默认 10，设为 0 关闭进度日志
#stall_timeout: 30     # 停滞判定秒：两个方向连续无数据达到该时长时输出停滞日志（之后每隔该时长重复一次，有新数据自动解除），默认 30，设为 0 关闭停滞检测

# 二选一：允许所有域名（开启后会忽略下面的 rules 列表，二选一）
#allow_all_hosts: true

# 二选一：仅允许指定域名（和上面的 allow_all_hosts 二选一）
rules:
  - example.com
  - b.example2.com